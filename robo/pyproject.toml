[project]
name = "mneme"
version = "0.1.0"
description = "Robô MNEME: aprende com o mercado e opera no simulado antes do dinheiro real."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "lightgbm>=4.6",
  "numpy>=2.5.4",
  "pandas>=3.1.0",
  "pyarrow>=26",
  "python-dotenv>=1.0",
  "scikit-learn>=1.9.1",
  "scipy>=1.14",
  "websockets>=15",
  "xgboost>=3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ta-lib>=0.8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
