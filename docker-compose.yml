services:
  mneme:
    build: .
    container_name: mneme
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro do contêiner escuta em todas as interfaces; fora dele, só no 127.0.0.1 (veja ports).
      MNEME_HOST: 0.0.0.0
    ports:
      # Painel acessível só pela própria máquina (túnel SSH). O acesso de fora é pela Cloudflare.
      - "127.0.0.1:4740:4740"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Opcional: publica o painel pela Cloudflare (Tunnel + Access), sem abrir portas.
  # Ligar com: docker compose --profile cloudflare up -d
  # No painel da Cloudflare, aponte o hostname do túnel para http://mneme:4740.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.2
    container_name: mneme-tunnel
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Lido do .env (CLOUDFLARE_TUNNEL_TOKEN). Vazio = o túnel não sobe e o log avisa.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - mneme
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
