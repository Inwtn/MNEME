name: Deploy MNEME Telegram Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/bot/**"
      - "migrations/**"
      - "wrangler.bot.jsonc"
      - ".gitattributes"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mneme-telegram-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required secrets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Configure CLOUDFLARE_ACCOUNT_ID as a repository variable or secret."; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Configure CLOUDFLARE_WORKER_API_TOKEN or CLOUDFLARE_API_TOKEN as a repository secret."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.9"

      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.129.0 d1 migrations apply mneme-operational --remote --config wrangler.bot.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.129.0 deploy --config wrangler.bot.jsonc

  poll-feed-after-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - name: Poll the real feed once and report the result
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$TELEGRAM_WEBHOOK_SECRET" ] || { echo "::error::Configure TELEGRAM_WEBHOOK_SECRET as a repository secret."; exit 1; }
          response="$(curl --fail --silent --show-error --max-time 40 \
            -X POST \
            -H "X-Mneme-Webhook-Secret: $TELEGRAM_WEBHOOK_SECRET" \
            https://mneme-telegram-bot.henriquesouza.workers.dev/admin/run-automation)"
          printf '%s\n' "$response" | jq '{ok, jobs: {groupSignals: .jobs.groupSignals, membership: .jobs.membership}}'
          printf '%s\n' "$response" | jq -e '.ok == true' >/dev/null


