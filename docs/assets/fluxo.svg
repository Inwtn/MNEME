<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Caminho de uma decisão: dados, atributos, modelos, decisão, risco e sinal">
<style>text{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{fill:#eaecef}.m{fill:#848e9c}.f{fill:#5e6673}
.dotA{animation:dotA 12s linear infinite}
@keyframes dotA{0%{transform:translateX(110px);opacity:0}3%{opacity:1}44%{transform:translateX(1090px);opacity:1}48%,100%{transform:translateX(1090px);opacity:0}}
.dotB{animation:dotB 12s linear infinite}
@keyframes dotB{0%,50%{transform:translateX(110px);opacity:0}53%{opacity:1}82%{transform:translateX(894px);opacity:1}88%,100%{transform:translateX(894px);opacity:0}}
.okA{animation:okA 12s steps(1) infinite}
@keyframes okA{0%,43%{opacity:0}44%,50%{opacity:1}51%,100%{opacity:0}}
.noB{animation:noB 12s steps(1) infinite}
@keyframes noB{0%,81%{opacity:0}82%,96%{opacity:1}97%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1200" height="250" rx="10" fill="#0b0e11"/><rect x=".5" y=".5" width="1199" height="249" rx="10" fill="none" stroke="#2b3139"/>
<text x="40" y="44" class="m" font-size="13">Caminho de uma decisão</text>
<line x1="192" y1="110" x2="224" y2="110" stroke="#2b3139" stroke-width="2"/><line x1="388" y1="110" x2="420" y2="110" stroke="#2b3139" stroke-width="2"/><line x1="584" y1="110" x2="616" y2="110" stroke="#2b3139" stroke-width="2"/><line x1="780" y1="110" x2="812" y2="110" stroke="#2b3139" stroke-width="2"/><line x1="976" y1="110" x2="1008" y2="110" stroke="#2b3139" stroke-width="2"/><rect x="28" y="72" width="164" height="76" rx="6" fill="#161a1e" stroke="#2b3139"/><text x="110" y="104" class="t" font-size="15" font-weight="600" text-anchor="middle">Dados</text><text x="110" y="127" class="m" font-size="11.5" text-anchor="middle">tempo real, sem lacunas</text><rect x="224" y="72" width="164" height="76" rx="6" fill="#161a1e" stroke="#2b3139"/><text x="306" y="104" class="t" font-size="15" font-weight="600" text-anchor="middle">Atributos</text><text x="306" y="127" class="m" font-size="11.5" text-anchor="middle">técnica, fluxo, eventos</text><rect x="420" y="72" width="164" height="76" rx="6" fill="#161a1e" stroke="#2b3139"/><text x="502" y="104" class="t" font-size="15" font-weight="600" text-anchor="middle">Modelos</text><text x="502" y="127" class="m" font-size="11.5" text-anchor="middle">aprendem e estimam</text><rect x="616" y="72" width="164" height="76" rx="6" fill="#161a1e" stroke="#2b3139"/><text x="698" y="104" class="t" font-size="15" font-weight="600" text-anchor="middle">Decisão</text><text x="698" y="127" class="m" font-size="11.5" text-anchor="middle">combina evidências</text><rect x="812" y="72" width="164" height="76" rx="6" fill="#161a1e" stroke="#2b3139"/><text x="894" y="104" class="t" font-size="15" font-weight="600" text-anchor="middle">Risco</text><text x="894" y="127" class="m" font-size="11.5" text-anchor="middle">limites determinísticos</text><rect x="1008" y="72" width="164" height="76" rx="6" fill="#161a1e" stroke="#2b3139"/><text x="1090" y="104" class="t" font-size="15" font-weight="600" text-anchor="middle">Sinal</text><text x="1090" y="127" class="m" font-size="11.5" text-anchor="middle">Telegram e simulado</text>
<circle class="dotA" cx="0" cy="110" r="7" fill="#0ecb81"/>
<circle class="dotB" cx="0" cy="110" r="7" fill="#f0b90b"/>
<g class="okA"><text x="1160" y="195" text-anchor="end" font-size="15" font-weight="600" fill="#0ecb81">Sinal registrado</text><text x="1160" y="218" text-anchor="end" font-size="12.5" class="m">com evidências, invalidação e resultado medido depois</text></g>
<g class="noB"><text x="976" y="195" text-anchor="end" font-size="15" font-weight="600" fill="#f6465d">Recusado pelo Risk Engine</text><text x="976" y="218" text-anchor="end" font-size="12.5" class="m">sem evidência suficiente, não opera, e o motivo fica registrado</text></g>
</svg>
