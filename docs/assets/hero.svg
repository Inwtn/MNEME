<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">MNEME</title>
  <desc id="descricao">Inteligência de trading híbrida: dados de mercado, machine learning, LLM com RAG, decisão e risco.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e11"/>
      <stop offset="1" stop-color="#161a1e"/>
    </linearGradient>
    <marker id="ponta" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#0ecb81"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .caixa { fill: #1e2329; stroke: #2b3139; }
      .destaque { fill: #0b2b20; stroke: #0ecb81; }
      .nome { fill: #eaecef; font-size: 17px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #848e9c; font-size: 13px; text-anchor: middle; }
      .linha { stroke: #0ecb81; stroke-width: 2; marker-end: url(#ponta); }
    </style>
  </defs>
  <rect width="1200" height="340" rx="14" fill="url(#fundo)"/>
  <text x="60" y="88" fill="#eaecef" font-size="54" font-weight="700" letter-spacing="4">MNEME</text>
  <text x="60" y="130" fill="#b7bdc6" font-size="23">Inteligência de trading que estuda o mercado, aprende com dados e mede cada decisão.</text>

  <g>
    <rect class="caixa" x="60" y="178" width="180" height="100" rx="10"/>
    <text class="nome" x="150" y="222">Dados</text>
    <text class="sub" x="150" y="246">mercado e notícias</text>

    <rect class="caixa" x="295" y="178" width="180" height="100" rx="10"/>
    <text class="nome" x="385" y="222">Machine learning</text>
    <text class="sub" x="385" y="246">aprende e estima</text>

    <rect class="caixa" x="530" y="178" width="180" height="100" rx="10"/>
    <text class="nome" x="620" y="222">LLM + RAG</text>
    <text class="sub" x="620" y="246">interpreta e contextualiza</text>

    <rect class="caixa" x="765" y="178" width="170" height="100" rx="10"/>
    <text class="nome" x="850" y="222">Decisão</text>
    <text class="sub" x="850" y="246">combina evidências</text>

    <rect class="destaque" x="990" y="178" width="150" height="100" rx="10"/>
    <text class="nome" x="1065" y="222">Risco</text>
    <text class="sub" x="1065" y="246">determinístico</text>

    <path class="linha" d="M240 228h53"/>
    <path class="linha" d="M475 228h53"/>
    <path class="linha" d="M710 228h53"/>
    <path class="linha" d="M935 228h53"/>
  </g>
</svg>
