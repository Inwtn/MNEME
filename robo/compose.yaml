# Serviços do MNEME na Oracle A1. Sem chaves: a coleta usa só dados públicos.
x-servico: &servico
  build: .
  user: "${MNEME_UID:-1001}:${MNEME_GID:-1001}"  # dono da pasta ./dados na A1
  environment:
    MNEME_DADOS_MERCADO: /dados/mercado
  volumes:
    - ./dados:/dados
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  coleta:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.dados", "coletar"]
    mem_limit: 600m
    cpus: 0.5
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/mercado/coleta.batimento').read_text()); raise SystemExit(d.datetime.now(d.timezone.utc)-t>d.timedelta(minutes=3))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Notícias, calendário e, com credencial no .env, o X. Texto externo é só dado.
  inteligencia:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.inteligencia", "rodar"]
    mem_limit: 500m
    cpus: 0.5
    cpu_shares: 256
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/mercado/inteligencia.batimento').read_text()); raise SystemExit(d.datetime.now(d.timezone.utc)-t>d.timedelta(minutes=5))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Grava previsões antes do resultado e não opera. Fica atrás da coleta na disputa por CPU.
  previsor:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.previsor", "rodar"]
    environment:
      MNEME_DADOS_MERCADO: /dados/mercado
      MNEME_MODELOS: /dados/modelos
    mem_limit: 1500m
    cpus: 1
    cpu_shares: 256
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/mercado/previsor.batimento').read_text()); raise SystemExit(d.datetime.now(d.timezone.utc)-t>d.timedelta(minutes=5))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # IA Generativa local e gratuita. A porta só existe dentro da própria máquina. Perde a disputa por CPU para a coleta.
  llm:
    image: ollama/ollama:0.12.6
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ./dados/ollama:/root/.ollama
    restart: always
    mem_limit: 5g
    cpus: 2
    cpu_shares: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  # Separado das velas: uma falha aqui não interrompe a coleta principal.
  fluxo:
    <<: *servico
    command: [".venv/bin/python", "-m", "mneme.dados", "fluxo"]
    stop_grace_period: 30s
    mem_limit: 600m
    cpus: 0.5
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import datetime as d,pathlib as p; t=d.datetime.fromisoformat(p.Path('/dados/mercado/fluxo/fluxo.batimento').read_text()); raise SystemExit(d.datetime.now(d.timezone.utc)-t>d.timedelta(minutes=3))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
